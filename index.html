<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Explorer</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f3f3f3; --line:#e1e1e1; --ink:#1f1f1f;
    --dim:#6b6b6b; --accent:#0078d7; --accent-bg:#cce8ff; --hover:#e8f0fe;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif;
       display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* address bar */
  #addressbar{display:flex;align-items:center;gap:6px;padding:8px 10px;
              background:var(--panel);border-bottom:1px solid var(--line);
              flex-shrink:0;overflow-x:auto;white-space:nowrap}
  #addressbar button.crumb{border:none;background:none;color:var(--accent);
              font:inherit;cursor:pointer;padding:4px 6px;border-radius:4px}
  #addressbar button.crumb:hover{background:var(--hover)}
  #addressbar .sep{color:var(--dim)}
  #up{border:1px solid var(--line);background:var(--bg);border-radius:4px;
      padding:4px 10px;cursor:pointer;font:inherit;flex-shrink:0}
  #up:hover{background:var(--hover)}

  /* body: sidebar + main */
  #body{flex:1;display:flex;overflow:hidden}
  #sidebar{width:38%;max-width:260px;background:var(--panel);
           border-right:1px solid var(--line);overflow-y:auto;
           padding:6px 0;flex-shrink:0}
  #main{flex:1;overflow-y:auto;position:relative}

  .tree-node{user-select:none}
  .tree-row{display:flex;align-items:center;gap:4px;padding:5px 6px 5px 0;
            cursor:pointer;white-space:nowrap;border-radius:4px;margin:0 4px}
  .tree-row:hover{background:var(--hover)}
  .tree-row.active{background:var(--accent-bg)}
  .tree-toggle{width:16px;text-align:center;color:var(--dim);flex-shrink:0}
  .tree-children{display:none}
  .tree-children.open{display:block}
  .tree-indent{display:inline-block}

  table{width:100%;border-collapse:collapse}
  thead th{position:sticky;top:0;background:var(--bg);text-align:left;
           padding:6px 10px;border-bottom:1px solid var(--line);
           font-weight:600;color:var(--dim);font-size:12px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--hover)}
  tbody tr.selected{background:var(--accent-bg)}
  tbody td{padding:5px 10px;border-bottom:1px solid #f5f5f5;white-space:nowrap}
  td.name{display:flex;align-items:center;gap:8px;overflow:hidden;
          text-overflow:ellipsis}
  td.size,td.mtime{color:var(--dim);font-size:12px}
  .icon{font-size:16px;flex-shrink:0}

  #empty{padding:30px;text-align:center;color:var(--dim)}
  #errbox{padding:30px;text-align:center;color:#a94442}
</style>
</head>
<body>

<div id="addressbar">
  <button id="up" title="Up one level">&uarr; Up</button>
</div>
<div id="body">
  <div id="sidebar"></div>
  <div id="main"></div>
</div>

<script>
const ICONS = {
  dir: "\u{1F4C1}",
  Images: "\u{1F5BC}\u{FE0F}", Videos: "\u{1F3AC}", Audio: "\u{1F3B5}",
  Documents: "\u{1F4C4}", Archives: "\u{1F4E6}", Installers: "\u{1F4F1}",
  other: "\u{1F4C3}",
};
const IMAGE_EXT = new Set(["jpg","jpeg","png","gif","webp","bmp","heic","svg"]);
const VIDEO_EXT = new Set(["mp4","mov","mkv","webm","avi","3gp","m4v"]);
const AUDIO_EXT = new Set(["mp3","wav","m4a","ogg","flac","opus"]);
const DOC_EXT = new Set(["pdf","doc","docx","xls","xlsx","ppt","pptx","txt","odt","md","csv"]);
const ARCHIVE_EXT = new Set(["zip","rar","7z","tar","gz","bz2"]);
const APK_EXT = new Set(["apk","apks","xapk"]);

function iconFor(entry) {
  if (entry.is_dir) return ICONS.dir;
  const ext = entry.name.split(".").pop().toLowerCase();
  if (IMAGE_EXT.has(ext)) return ICONS.Images;
  if (VIDEO_EXT.has(ext)) return ICONS.Videos;
  if (AUDIO_EXT.has(ext)) return ICONS.Audio;
  if (DOC_EXT.has(ext)) return ICONS.Documents;
  if (ARCHIVE_EXT.has(ext)) return ICONS.Archives;
  if (APK_EXT.has(ext)) return ICONS.Installers;
  return ICONS.other;
}

function fmtSize(bytes, isDir) {
  if (isDir) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " MB";
  return (bytes / 1024 / 1024 / 1024).toFixed(1) + " GB";
}

function fmtDate(epoch) {
  const d = new Date(epoch * 1000);
  return d.toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"}) +
         " " + d.toLocaleTimeString(undefined, {hour: "2-digit", minute: "2-digit"});
}

async function apiList(path) {
  const res = await fetch("/api/list?path=" + encodeURIComponent(path));
  if (!res.ok) throw new Error((await res.json()).error || res.statusText);
  return res.json();
}

let currentPath = "";

function renderBreadcrumb(path) {
  const bar = document.getElementById("addressbar");
  bar.querySelectorAll(".crumb,.sep").forEach(el => el.remove());
  const root = document.createElement("button");
  root.className = "crumb";
  root.textContent = "This PC";
  root.onclick = () => navigate("");
  bar.appendChild(root);
  if (!path) return;
  const parts = path.split("/");
  let acc = "";
  for (const part of parts) {
    acc = acc ? acc + "/" + part : part;
    const sep = document.createElement("span");
    sep.className = "sep";
    sep.textContent = " › ";
    bar.appendChild(sep);
    const b = document.createElement("button");
    b.className = "crumb";
    b.textContent = part;
    const target = acc;
    b.onclick = () => navigate(target);
    bar.appendChild(b);
  }
}

function renderMain(path, data) {
  const main = document.getElementById("main");
  main.innerHTML = "";
  if (!data.entries.length) {
    main.innerHTML = '<div id="empty">This folder is empty.</div>';
    return;
  }
  const table = document.createElement("table");
  table.innerHTML = "<thead><tr><th>Name</th><th>Size</th><th>Modified</th></tr></thead>";
  const tbody = document.createElement("tbody");
  for (const entry of data.entries) {
    const tr = document.createElement("tr");
    const childPath = path ? path + "/" + entry.name : entry.name;
    tr.innerHTML =
      '<td class="name"><span class="icon">' + iconFor(entry) + '</span><span></span></td>' +
      '<td class="size">' + fmtSize(entry.size, entry.is_dir) + '</td>' +
      '<td class="mtime">' + fmtDate(entry.mtime) + '</td>';
    tr.querySelector(".name span:last-child").textContent = entry.name;
    tr.ondblclick = () => {
      if (entry.is_dir) navigate(childPath);
      else window.open("/api/file?path=" + encodeURIComponent(childPath), "_blank");
    };
    tr.onclick = () => {
      tbody.querySelectorAll("tr.selected").forEach(r => r.classList.remove("selected"));
      tr.classList.add("selected");
    };
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  main.appendChild(table);
}

async function navigate(path) {
  try {
    const data = await apiList(path);
    currentPath = data.path;
    renderBreadcrumb(currentPath);
    renderMain(currentPath, data);
    highlightSidebar(currentPath);
  } catch (err) {
    document.getElementById("main").innerHTML =
      '<div id="errbox">' + (err.message || "couldn't load that folder") + "</div>";
  }
}

document.getElementById("up").onclick = () => {
  if (!currentPath) return;
  const parts = currentPath.split("/");
  parts.pop();
  navigate(parts.join("/"));
};

// --- sidebar tree ---

function highlightSidebar(path) {
  document.querySelectorAll("#sidebar .tree-row").forEach(r => r.classList.remove("active"));
  const row = document.querySelector('#sidebar .tree-row[data-path="' + CSS.escape(path) + '"]');
  if (row) row.classList.add("active");
}

async function buildNode(path, container, depth) {
  const data = await apiList(path);
  for (const entry of data.entries) {
    if (!entry.is_dir) continue;
    const childPath = path ? path + "/" + entry.name : entry.name;
    const node = document.createElement("div");
    node.className = "tree-node";
    const row = document.createElement("div");
    row.className = "tree-row";
    row.dataset.path = childPath;
    row.innerHTML =
      '<span class="tree-indent" style="width:' + (depth * 14) + 'px"></span>' +
      '<span class="tree-toggle">▸</span>' +
      '<span class="icon">' + ICONS.dir + '</span>' +
      '<span></span>';
    row.lastElementChild.textContent = entry.name;
    const childrenBox = document.createElement("div");
    childrenBox.className = "tree-children";
    let loaded = false;
    row.onclick = async (ev) => {
      if (!loaded) {
        loaded = true;
        await buildNode(childPath, childrenBox, depth + 1);
      }
      childrenBox.classList.toggle("open");
      row.querySelector(".tree-toggle").textContent =
        childrenBox.classList.contains("open") ? "▾" : "▸";
      navigate(childPath);
    };
    node.appendChild(row);
    node.appendChild(childrenBox);
    container.appendChild(node);
  }
}

buildNode("", document.getElementById("sidebar"), 0);
navigate("");
</script>
</body>
</html>
